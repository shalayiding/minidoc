[project]
name = "minidoc-dsl"
version = "0.1.0"
description = "Compile MiniDoc DSL to beautiful HTML pages"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3.1",
    "tiktoken>=0.13.0",
]

[project.scripts]
minidoc     = "minidoc.cli:main"
minidoc-mcp = "minidoc._mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
