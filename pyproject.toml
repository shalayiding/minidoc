[project]
name = "minidoc-dsl"
version = "0.1.1"
description = "Stop writing docs in Markdown. Write compact DSL, get polished HTML with charts, diagrams, and more."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastmcp>=3.3.1",
    "tiktoken>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/shalayiding/minidoc"
Documentation = "https://shalayiding.github.io/minidoc/"
Repository = "https://github.com/shalayiding/minidoc"

[project.scripts]
minidoc     = "minidoc.cli:main"
minidoc-mcp = "minidoc._mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["minidoc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
